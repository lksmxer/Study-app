<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="timer-container">
        <div class="timer">
            <span id="minutes">25</span>:<span id="seconds">00</span>
        </div>
        <div class="timer-controls">
            <button id="start-btn">Start</button>
            <button id="pause-btn">Pause</button>
            <button id="reset-btn">Reset</button>
        </div>
    </div>
    <div class="timer-settings">
        <label for="study-time">Study Time (minutes):</label>
        <input type="number" id="study-time" value="25" min="1">
        <label for="rest-time">Rest Time (minutes):</label>
        <input type="number" id="rest-time" value="5" min="1">
    </div>
    <div class="background-settings">
        <button class="bg-btn" data-bg="wallpaper1.jpg">1</button>
        <button class="bg-btn" data-bg="wallpaper2.jpg">2</button>
        <button class="bg-btn" data-bg="wallpaper3.jpg">3</button>
    </div>

    <div class="music-player">
        <audio id="audio-player" src=""></audio>
        <div class="music-controls">
            <button id="prev-btn">Prev</button>
            <button id="play-pause-btn">Play</button>
            <button id="next-btn">Next</button>
        </div>
        <div class="song-info">
            <p id="song-title">Song Title</p>
            <p id="song-artist">Song Artist</p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
